# Builds the nicro Android app (android/) and publishes nicro.apk as the "android-latest" release.
# The panel's "Download the app" button points at that asset.
name: android app
on:
  push:
    branches: [main]
    paths: ['android/**', 'frontend/public/icon-512.png', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # the runner image already has the Android SDK ($ANDROID_HOME) with accepted licenses
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Publish release android-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk nicro.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest nicro.apk --prerelease --target "$GITHUB_SHA" \
            --title "nicro for Android" --notes "The panel as an Android app (build $GITHUB_RUN_NUMBER). Install nicro.apk, open it — the panel address is taken from the clipboard."
